name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/family_lab_ci
      APP_ENCRYPTION_KEY: family-lab-ci-encryption-key-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: family_lab_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npx prisma generate
      - run: npm run test:safety
      - run: node --experimental-strip-types --test tests/specimen-storage-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/specimen-transfer-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/result-validation-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/report-version-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-19-longitudinal-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-20-report-cumulative-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-21-patient-history-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-22-aliquot-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-23-medical-validation-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-24-catalog-export-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-25-component-import-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-26-price-import-mariadb.integration.test.ts
      - run: node --experimental-strip-types --test tests/stage-27-catalog-review-csv-mariadb.integration.test.ts
