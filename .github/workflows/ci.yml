name: CI

on:
  pull_request:
    branches: [main]
    # Explicit merged-PR run: App-authored merges may not emit a push CI run.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # A closed-unmerged PR is not a valid release candidate.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/family_lab_ci
      APP_ENCRYPTION_KEY: family-lab-ci-encryption-key-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: family_lab_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A merged PR's closed event must validate the exact commit on main,
          # not the old PR head, an inferred base, or a stale test-merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Verify exact merged main revision
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
        env:
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "${{ github.event.pull_request.base.ref }}" = "main"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f2-mapping-reviewer-feedback-mariadb.integration.test.ts
      - run: timeout --signal=TERM --kill-after=10s 180s node --experimental-strip-types --test tests/f3-*.test.ts
      - run: node --test tests/f4-analyzer-interference-bridge.test.mjs
      - run: timeout --signal=TERM --kill-after=10s 180s node --experimental-strip-types --test tests/f4-*.test.ts tests/analyzer-bridge.test.mjs
      - run: timeout --signal=TERM --kill-after=10s 180s node --experimental-strip-types --test tests/f5-*.test.ts tests/ui-catalog-import-review-dialogs.test.ts
      - run: npm run test:safety
      - name: Verify concurrent portal booking idempotency in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-appointment-idempotency-mariadb.integration.test.ts
      - name: Verify concurrent OTP claims and retry limits in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-otp-atomic-mariadb.integration.test.ts
      - name: Verify serialized OTP issuance in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-otp-request-race-mariadb.integration.test.ts
      - name: Verify revoked identity and session block OTP issuance in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-otp-issuance-live-identity-mariadb.integration.test.ts
      - name: Verify OTP live principal revocation in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-otp-principal-revocation-mariadb.integration.test.ts
      - name: Verify atomic rate limit rollover in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-rate-limit-atomic-mariadb.integration.test.ts
      - name: Verify atomic portal contact provisioning in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-account-contact-provision-mariadb.integration.test.ts
      - name: Verify tenant-safe portal login identity uniqueness in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-login-identity-ambiguity-mariadb.integration.test.ts
      - name: Verify portal login rechecks live contact after bcrypt in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-login-transaction-identity-mariadb.integration.test.ts
      - name: Verify live portal login principal after bcrypt in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-login-live-principal-mariadb.integration.test.ts
      - name: Verify portal password change revocation and disable race in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-password-revocation-mariadb.integration.test.ts
      - name: Verify portal password live principal revocation in MariaDB
        run: timeout --signal=TERM --kill-after=10s 120s node --experimental-strip-types --test tests/f7-portal-password-live-principal-mariadb.integration.test.ts
