name: UI Synthetic Browser Sweep — Manual Evidence Only

on:
  workflow_dispatch:
    inputs:
      confirm_synthetic_staging:
        description: "I verified isolated staging contains synthetic-only records (never use production/PHI)"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

jobs:
  visual-audit:
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.private == true && github.event.inputs.confirm_synthetic_staging == 'YES' && vars.FL_UI_AUDIT_ENABLE == 'true' && vars.FL_UI_AUDIT_SYNTHETIC_ONLY == 'I_CONFIRM_SYNTHETIC_NONPRODUCTION_DATA' }}
    environment: ui-synthetic-staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install exact project and browser dependencies (no lockfile edits)
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate every route has a synthetic fixture and role scope
        env:
          UI_QA_FIXTURE_ROUTES_JSON: ${{ secrets.UI_QA_FIXTURE_ROUTES_JSON }}
        run: node scripts/ui-browser-acceptance.mjs --plan
      - name: Run read-only route screenshot sweep
        env:
          UI_QA_SYNTHETIC_ATTESTATION: ISOLATED_SYNTHETIC_ONLY
          UI_QA_BASE_URL: ${{ secrets.UI_QA_STAGING_BASE_URL }}
          UI_QA_STAFF_PROFILES_JSON: ${{ secrets.UI_QA_STAFF_PROFILES_JSON }}
          UI_QA_PORTAL_PROFILE_JSON: ${{ secrets.UI_QA_PORTAL_PROFILE_JSON }}
          UI_QA_FIXTURE_ROUTES_JSON: ${{ secrets.UI_QA_FIXTURE_ROUTES_JSON }}
          UI_QA_OUTPUT_DIR: ui-evidence/browser-sweep
        run: node scripts/ui-browser-acceptance.mjs --run
      - name: Upload screenshot and failure evidence (not clinical UAT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-sweep-evidence
          path: ui-evidence/browser-sweep
          if-no-files-found: warn
          retention-days: 2
